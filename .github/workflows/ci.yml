name: ci
on:
  # Only main: a push to a PR branch is already covered by pull_request, and a
  # second run on push would also defeat the draft skip below.
  push:
    branches: [main]
  pull_request:
    # ready_for_review is listed so a draft gets its checks the moment it is
    # marked ready; the default types alone would wait for the next push.
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  test:
    # Draft PRs skip every job that carries this condition. A skipped job
    # still counts as passing, and marking the PR ready runs it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Registry is valid
        run: python3 engine/jurisdictions.py check
      - name: Unit tests
        run: python3 -m unittest discover -s engine/tests -p "test_*.py" -v
      - name: Scanner parses, robots matcher
        run: node --check engine/scan.mjs && node engine/tests/robots.test.mjs
      - name: Shell scripts
        run: bash -n install.sh engine/audit.sh engine/ensure-deps.sh
      - name: No contributor names or machine paths
        run: "! grep -rnIE '/Users/|/home/[a-z]+/' --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests --exclude-dir=registry ."
